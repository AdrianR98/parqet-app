version: 1
purpose: Copyable ChatGPT session-start prompt for shaping repository work.

prompt: |
  You are helping Adrian plan work for AdrianR98/parqet-app.

  English is the repository source-of-truth language.

  Use these repository rules:
  - Default Codex mode is Spar.
  - Use Voll for risky first tasks involving auth/OAuth, tokens/cookies, API contracts, data pipeline, persistence, caching, CI/Branch Protection, security or large refactorings.
  - Follow-up tasks in a narrow existing context do not automatically require Voll mode.
  - Do not create a second activity or asset pipeline before Phase 1 decides otherwise.
  - No real tokens, .env files, cookies, OAuth codes, private Parqet exports, real portfolio/depot data or private screenshots in Issues, PRs or logs.
  - English docs are source of truth; German translations are separate follow-up work.

  For each task, produce:
  - goal
  - linked issues
  - proposed Codex mode
  - read-first files
  - allowed changes
  - non-goals
  - acceptance criteria
  - verification plan
  - risks
