version: 2
purpose: Execution and reporting rules for Codex tasks.

execution:
  - Inspect requested files before editing.
  - Treat prompts missing any required field from prompts/codex-task-template.yaml as not ready to issue.
  - Respect the branch requested by the task.
  - Do not choose a branch name if none was provided.
  - Commit only when the task explicitly allows commits.
  - Open a PR only when Create PR is yes.
  - Keep unrelated dirty worktree changes out of the PR.
  - Use explicit staging when the worktree is mixed.
  - Stay within Allowed changes and Do not modify.
  - Stop and ask before exceeding mode file limits unless mode is Voll.
  - Treat broad UI, architecture, data and test tasks as context-budgeted work.
  - For non-Voll implementation tasks, stop and propose a smaller slice if more than 6 app files appear necessary unless the task explicitly allows the broader scope.
  - Prefer an analysis-only first pass for broad or uncertain work before implementing.
  - Do not modify app implementation files for governance-only tasks.
  - Do not add tests, libraries or tooling unless requested by the issue.
  - Do not create or modify GitHub labels in code.
  - Do not create label-management scripts.
  - Do not close issues, set milestones, set parent/sub-issue relationships or merge PRs.

search:
  preferred:
    - git grep
    - git ls-files
    - rg when available
  efficiency:
    - Use search before broad file reads unless the exact file and needed section are already known.
    - Prefer focused excerpts around matches over full-file reads for large files.
    - Batch independent file reads or searches when possible.
    - Read full files only when the complete file shape is required for a safe edit or review.
    - Do not print full files unless they are short or required for a safe edit.
    - Avoid printing huge files, generated outputs or full logs after successful checks.
  if_blocked:
    - use an allowed alternative
    - report the limitation only when it affects confidence
  forbidden_private_paths:
    - .local/
    - .env
    - .env.*
    - private exports
    - real portfolio data

tool_plugin_policy:
  source_of_truth:
    - Repository files, linked issues, PR template, ADRs and project docs remain the source of truth.
    - Plugins are helper tools, not authoritative planning or scope sources.
    - Plugin guidance may assist execution but must not override issue scope, Non-goals, API Budget Impact, Privacy/Data Impact, verification profile or repo rules.
  superpowers:
    allowed_for:
      - brainstorming
      - planning
      - systematic debugging
      - TDD discipline when tests are explicitly in scope
      - pre-review / finish-branch discipline
    limits:
      - Do not force TDD or implementation when the issue is research/docs-only.
      - Do not create broader plans than the linked issue allows.
      - Do not override required Codex task fields.
  vercel:
    allowed_for:
      - Vercel build/deploy/debug tasks
      - Next.js/Vercel platform documentation questions
      - deployment log investigation
      - Vercel status or ignored-build verification
    limits:
      - Do not use for routine repo/docs-only work unless deployment behavior is relevant.
      - Do not change Vercel project settings, environment variables or deployment protection unless explicitly authorized.
  figma:
    allowed_for:
      - UI/UX design exploration
      - design-system and component analysis
      - layout and visual implementation reference
      - FigJam diagrams, flowcharts and concept visualizations
      - presentation/concept visualization
      - design-to-code tasks when explicitly in scope
    limits:
      - Do not use for routine data-pipeline, provider/API, backend, privacy or docs-only tasks unless a visual/design artifact is explicitly requested.
      - Do not create or modify Figma files unless the task explicitly authorizes Figma write actions.
      - Do not treat Figma output as implementation authority over repository components, theme tokens, accessibility, API Budget Impact or Privacy/Data Impact.
      - Do not include screenshots or designs containing private portfolio, account, depot, token, cookie, OAuth or provider payload data.
  browser_or_playwright:
    allowed_for:
      - UI behavior verification
      - hydration/navigation checks
      - visual/responsive checks
      - smoke-test debugging
    limits:
      - Do not use for data-pipeline research/docs-only issues.
      - Do not capture screenshots with private data.
  additional_plugins:
    limits:
      - Use only when task-relevant.
      - Do not install new plugins, dependencies or tooling unless explicitly authorized.
      - Do not grant broader access than the task requires.
  reporting:
    - PR bodies should mention material plugin usage when it affected findings, verification or implementation.

implementation_loop:
  - Make one coherent patch after enough targeted context is known.
  - Prefer apply_patch or an equivalent focused patch method over repeated micro-edits.
  - If the same blocker survives two implementation strategies, stop and report the blocker instead of trying a third unrelated approach.
  - For failing tests, inspect only the relevant failure excerpt or Playwright error-context file.
  - Do not weaken assertions only to make a failing test pass; document exposed product bugs or split a bugfix follow-up.

mode_file_limits:
  Mini: explicitly named files only
  Spar: 6
  Normal: 10
  Voll: no hard limit; file groups must be planned
  Folgeauftrag: original scope only
  Review-Fix: review feedback or introduced failure only

verification:
  final_gate:
    - GitHub Actions is the final PR gate for lint/build and V1 Playwright smoke unless Adrian explicitly approves and documents an exception.
    - Codex should run only scope-relevant local checks before opening a PR.
    - Codex should not poll CI for long; one short status check after opening a PR is enough unless the task explicitly requires waiting.
    - ChatGPT/Reviewer verifies final GitHub Actions status before merge.
  profiles:
    docs_or_prompt_only:
      local_run:
        - git diff --check
        - markdown/yaml validation when available and relevant
      local_do_not_run_by_default:
        - npm run lint
        - npx tsc --noEmit
        - npm run build
        - npm run test:e2e
      final_gate:
        - GitHub Actions
    workflow_only:
      local_run:
        - git diff --check
        - workflow syntax/lint check when available and relevant
      local_do_not_run_by_default:
        - npm run test:e2e unless the workflow change directly changes E2E behavior and local feedback is needed
        - npm run build unless package/runtime behavior changed
      final_gate:
        - GitHub Actions workflow execution
    ts_ui:
      local_run:
        - git diff --check
        - npm run lint
        - npx tsc --noEmit
      local_optional:
        - npm run build only when app runtime, Next route/config, dependency or build-relevant behavior changed
      local_do_not_run_by_default:
        - npm run test:e2e
      final_gate:
        - GitHub Actions lint/build/e2e
    runtime_route_or_config:
      local_run:
        - git diff --check
        - npm run lint
        - npx tsc --noEmit
        - npm run build
      local_optional:
        - focused tests when available and directly relevant
      local_do_not_run_by_default:
        - npm run test:e2e unless route/navigation/browser behavior is directly affected
      final_gate:
        - GitHub Actions lint/build/e2e
    e2e_sensitive:
      use_for:
        - Playwright config or E2E tests
        - hydration behavior
        - browser-local state
        - navigation behavior covered by smoke tests
        - provider-route guards
        - UI interactions explicitly covered by smoke tests
      local_run:
        - git diff --check
        - npm run lint when code changed
        - npx tsc --noEmit when TypeScript changed
        - focused Playwright tests with -g when practical
        - npm run test:e2e when E2E config/tests or smoke-covered behavior changed materially
      final_gate:
        - GitHub Actions lint/build/e2e
  legacy_defaults:
    current_ci:
      - npm run lint
      - npm run build
    docs_or_prompt_only:
      - git diff --check
      - markdown/yaml validation when available and relevant
    code_changes:
      - npm run lint
      - npm run build only when build-relevant
      - relevant focused tests only when scope-relevant
  test_loop:
    - Run focused tests during development when available and relevant to the verification profile.
    - Run the full relevant local test suite only when the profile requires it.
    - Do not run lint, build and E2E tests concurrently.
    - Re-run failed checks only after a relevant fix.
    - Manual browser inspection is optional unless automated tests do not cover the changed behavior, a visual interaction must be checked, or the task explicitly requires browser review.
    - If manual browser inspection is run, keep it bounded to the affected pages and avoid reading browser/tool skill docs unless needed.
  always_use_terms:
    - Run
    - Not run
    - Not applicable
  not_run_requires_reason: true
  not_applicable_only_when_check_does_not_fit: true
  if_missing_or_failing:
    - report clearly
    - avoid broad cleanup
    - suggest follow-up issues

ci_and_vercel:
  github_ci: factual merge gate unless Adrian explicitly approves a documented exception
  docs_governance_vercel: Ignored is valid when only safe docs/governance files changed
  app_deployment_vercel: Ready/Success expected before merge unless exception documented
  red_ci: do not merge unless Adrian explicitly approves and documents exception

reporting:
  progress_updates:
    - Keep updates short and milestone-based.
    - Do not narrate every command or routine file read.
    - Report meaningful blockers, verification results and scope deviations.
  include_when_relevant:
    - branch
    - changed files
    - removed files
    - verification profile
    - verification results
    - lint/build gaps
    - deviations from task
    - risks
    - known gaps / follow-up work
    - intentionally unchanged areas for larger Normal/Voll PRs
  avoid:
    - huge logs
    - full-file dumps
    - full-diff dumps after successful implementation
    - private chain-of-thought
    - private API response data
  diff_reporting:
    - Prefer git diff --stat for final reporting.
    - Use targeted changed-hunk excerpts only when needed for diagnosis or review confidence.
    - Do not paste complete diffs for multi-file changes unless explicitly requested.
  failure_logs:
    - include only relevant excerpts
    - private data in logs is a blocker

pr_body_must_include:
  - Linked issues
  - Phase checklist
  - Goal or Summary
  - Mode / Codex involvement
  - Scope / changed files
  - Non-goals
  - Verification profile
  - Verification
  - Documentation impact
  - API Budget Impact
  - Privacy / Data Impact
  - Risk
  - Rollback
  - What was intentionally not changed for larger Normal/Voll PRs

pr_body_preflight:
  - Use .github/PULL_REQUEST_TEMPLATE.md headings unless the task explicitly allows a shorter body.
  - Keep PR sections complete but concise; do not repeat the full issue text.
  - Check exactly the appropriate Phase line where practical.
  - Use Phase 4 for V1 hardening/test work unless the issue says otherwise.
  - Re-check Refs versus Fixes before opening or updating the PR.
  - Use Fixes only when the issue should close automatically on merge.
  - Update the PR body after review fixes when scope, files, verification profile, verification, risks, known gaps or Refs/Fixes correctness changed.

review_fix:
  update_pr_body_when_changed:
    - scope
    - changed files
    - verification profile
    - verification
    - risks
    - known gaps
    - Refs/Fixes correctness
    - Phase checklist

security_privacy:
  - No real tokens, cookies, OAuth codes, access tokens or refresh tokens in issues, PRs, commits or logs.
  - No real .env files.
  - No private Parqet exports.
  - No real portfolio or depot data.
  - No screenshots with real portfolio, account, depot or personal data.
  - No full private API responses in debug logs.
  - Debug logging in app code requires explicit permission.
  - If private data appears in a diff, the PR is blocked.
