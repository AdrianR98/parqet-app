version: 2
purpose: Quick rules for Mini, Spar, Folgeauftrag and Review-Fix tasks.

defaults:
  read_before_editing: true
  preserve_product_behavior: true
  report_verification: true
  never_merge: true

mode_selection:
  selected_by: ChatGPT
  codex_must_not_choose_mode: true
  missing_mode: stop_and_report_incomplete_task

shared_rules:
  - Read AGENTS.md before editing.
  - Every non-trivial Codex task must include all required fields from prompts/codex-task-template.yaml.
  - A prompt missing any required field is not ready to issue and must be corrected before Codex receives it.
  - If Mode is missing, stop and report the task as incomplete instead of choosing a default mode.
  - Use the requested branch only.
  - Do not choose a branch name when none is provided.
  - Commit only when explicitly allowed.
  - Never create PRs; Create PR remains disabled for Codex execution.
  - Never run gh pr create.
  - Keep changes within Allowed changes.
  - Do not edit paths listed under Do not modify.
  - Do not widen scope for cleanup.
  - Stop for unclear product goal, user flow, data model, privacy or security questions.
  - Use Refs for parent issues and partial work.
  - Use Fixes only when a sub-issue is fully completed.
  - Keep AGENTS.md as the compact entrypoint; use detailed prompt/docs files only when required by mode or scope.

efficiency_rules:
  - Prefer rg, git grep and git ls-files before reading full files.
  - Prefer focused excerpts around matches over full-file reads for large files.
  - Batch independent context reads where practical instead of reading files one-by-one.
  - Do not re-read or re-edit the same file repeatedly without a new reason.
  - Stop and report if two implementation strategies fail for the same blocker.
  - Keep progress updates short and milestone-based; do not narrate every command.

context_budget_rules:
  - Treat broad UI, architecture, data and test tasks as context-budgeted work.
  - Do not print full files unless they are short or required for a safe edit.
  - Do not print full diffs after implementation; prefer git diff --stat plus targeted changed-hunk excerpts only when needed.
  - Prefer analysis-only first passes for broad or uncertain work before implementing.
  - Manual browser inspection is optional unless tests do not cover the changed behavior, a visual interaction must be checked, or the task explicitly requires browser review.
  - If more than 6 app files appear necessary for a non-Voll implementation task, stop and propose a smaller slice unless the prompt explicitly allows the broader scope.
  - Keep PR bodies complete but concise; do not repeat the full issue text.

verification_profile_rules:
  - Use scope-based verification instead of running all local checks by default.
  - GitHub Actions is the final PR gate for lint/build and V1 Playwright smoke.
  - Codex should not poll CI for long; one short status check is enough unless the task explicitly requires waiting.
  - Docs/prompt-only tasks should normally run only git diff --check plus markdown/yaml validation when relevant.
  - Workflow-only tasks should normally run git diff --check plus workflow syntax/lint when available, then rely on GitHub Actions.
  - TypeScript/UI tasks should normally run git diff --check, npm run lint and npx tsc --noEmit.
  - Local npm run build should run only when app runtime, Next route/config, dependency or build-relevant behavior changed.
  - Local npm run test:e2e should run only for E2E-sensitive changes such as Playwright config/tests, hydration, browser-local state, navigation/provider-route guards or smoke-covered browser interactions.
  - Manual browser checks must stay bounded to affected pages and only run when automated tests do not cover the changed behavior or visual review is explicitly needed.

mini:
  use_for:
    - typos
    - link fixes
    - tiny documentation changes
    - tiny prompt wording fixes
    - mechanical template cleanup
  read:
    - AGENTS.md
    - explicitly named files
  file_limit: explicitly named files only
  repository_wide_search: false
  pr_allowed: false
  report: 3-5 lines
  avoid:
    - app behavior changes
    - code fixes
    - architecture decisions
    - security-sensitive work
    - dependency or workflow changes

spar:
  use_for:
    - focused documentation updates
    - small prompt/template changes
    - bounded implementation tasks with clear acceptance criteria
  read:
    - AGENTS.md
    - prompts/codex-quick-rules.yaml
    - explicitly relevant files
  file_limit: 6
  search:
    - targeted git grep / git ls-files allowed when needed
    - broad repository analysis not allowed
    - read full files only when the full file is small or required for the edit
  plan_required: only_when_uncertain
  requirements:
    - list changed files when reporting a PR
    - run relevant lightweight verification
    - report risks only when relevant

folgeauftrag:
  use_for:
    - narrow follow-up in an already reviewed context
    - same branch or PR context
    - small correction after a prior PR or issue discussion
  requirements:
    - keep original scope
    - reuse existing context only for the same branch/PR and narrow scope
    - do not reopen settled decisions without explicit instruction
    - update PR body if verification, changed files or known gaps changed

review_fix:
  use_for:
    - addressing PR review comments
    - fixing CI or lint/build failures introduced by the PR
  requirements:
    - address only actionable feedback
    - run checks affected by the fix
    - update PR body if scope, changed files, verification profile, verification, risks or known gaps changed
    - re-check Refs/Fixes correctness
    - report comments fixed and comments deferred
    - do not use review feedback as permission for unrelated cleanup

must_escalate_to_voll_when_touching:
  - Auth/OAuth first tasks
  - Tokens/Cookies
  - Parqet API contracts
  - Persistence
  - Caching
  - Security
  - Branch Protection
  - Large refactorings

may_require_normal_or_higher:
  - scripts/**
  - package.json
  - .github/workflows/**
  - new tests or test setup
  - medium governance updates
  - Vercel ignored-build logic changes

known_project_patterns:
  playwright_local_state:
    - Use Playwright storageState for initial synthetic browser-local state.
    - Use http://localhost:3000 for Playwright baseURL and webServer.url.
    - Do not use addInitScript, setup routes or post-navigation localStorage writes for initial hydration-state fixtures unless explicitly justified.
    - During development, run focused Playwright tests with -g only when E2E-sensitive behavior changed.
    - Rely on GitHub Actions V1 Playwright smoke as the final PR E2E gate.
    - Do not run lint, build and E2E tests concurrently.
  browser_local_hydration:
    - Server render and first client render must use a neutral SSR-safe state.
    - Browser-local state should be applied after hydration unless a dedicated SSR-safe hook/pattern is used.
  api_budget_local_ui:
    - Navigation, filtering, sorting, detail panels, report layout and local settings must not trigger hidden provider calls.

verification_shortcuts:
  docs_or_prompt_only:
    - git diff --check
    - markdown or yaml check when available and relevant
  workflow_only:
    - git diff --check
    - workflow syntax/lint check when available and relevant
    - GitHub Actions final gate
  ts_ui:
    - git diff --check
    - npm run lint
    - npx tsc --noEmit
    - GitHub Actions final gate for build/e2e
  e2e_sensitive:
    - git diff --check
    - focused Playwright test when practical
    - npm run test:e2e only when the changed behavior directly needs local E2E feedback
    - GitHub Actions final gate
