version: 3
mode_selection:
  required: true
  selected_by: ChatGPT
  codex_must_not_choose_mode: true
  missing_mode: stop_and_report_incomplete_task

task_modes:
  Mini:
    description: Tiny low-risk documentation, wording or mechanical changes.
    max_files: explicitly named files only
  Spar:
    description: Focused work with limited files.
    max_files: 6
  Normal:
    description: Moderate work needing broader repository context.
    max_files: 10
  Voll:
    description: Full-context work for risky or cross-cutting tasks.
    max_files: no fixed limit; file groups must be planned
  Folgeauftrag:
    description: Narrow follow-up in an existing context.
    max_files: within original scope
  Review-Fix:
    description: Targeted PR review or CI fix.
    max_files: only files needed for review feedback or introduced failure

required_fields:
  - repo
  - mode
  - branch
  - create_pr
  - linked_issues
  - allowed_changes
  - do_not_modify
  - non_goals
  - acceptance_criteria
  - verification_profile
  - verification
  - api_budget_impact
  - privacy_data_impact
  - handoff_requirements

required_field_rule: >
  Every non-trivial Codex task must include all required_fields. If any
  required field is missing, the prompt is not ready to be issued and must be
  corrected before it is given to Codex. If mode or branch is missing, Codex
  must stop and report the task as incomplete instead of choosing defaults.

create_pr_policy: Codex never creates pull requests. Keep create_pr present for governance tracking and set it to no for Codex tasks.

low_budget_defaults:
  purpose: Keep Codex usage low unless the task explicitly asks for verification, commit, push or PR work.
  default_rules:
    - Default verification_profile is not_run_by_default.
    - Do not commit.
    - Do not push.
    - Do not create PRs.
    - Do not run tests, lint, typecheck, build, Playwright, Vitest, Jest, smoke probes, browser probes, API probes, Vercel deploys or verification commands unless explicitly named in the task.
    - Read only the minimum required files.
    - Prefer targeted sections/ranges over full-file reads.
    - Do not run broad repository searches unless the exact file is unknown or blocked.
    - Stop if scope would exceed the selected mode file limit unless explicitly allowed.
    - Output final compact handoff only unless blocked.

optional_fields:
  - tool_plugin_guidance

branch_prefixes:
  - docs/
  - chore/
  - fix/
  - feat/
  - test/
  - refactor/

verification_profiles:
  not_run_by_default:
    use_for:
      - default low-budget Codex tasks
      - prompt/governance-only changes unless checks are explicitly requested
      - implementation work where user, ChatGPT or GitHub Actions will verify
    local_run: []
    local_do_not_run_by_default:
      - git diff --check
      - npm run lint
      - npx tsc --noEmit
      - npm run build
      - npm run test:e2e
      - Playwright, Vitest, Jest or smoke probes
      - browser probes
      - API probes
      - Vercel deploys
    final_gate:
      - GitHub Actions
      - user review
      - ChatGPT diff review
  docs_or_prompt_only:
    use_for:
      - markdown-only changes
      - prompt/governance-only changes
      - documentation text with no app runtime impact
    local_run:
      - only checks explicitly named in the task
    local_do_not_run_by_default:
      - git diff --check
      - npm run lint
      - npx tsc --noEmit
      - npm run build
      - npm run test:e2e
    final_gate:
      - GitHub Actions
  workflow_only:
    use_for:
      - .github/workflows changes
      - CI configuration changes without app runtime changes
    local_run:
      - only checks explicitly named in the task
    local_do_not_run_by_default:
      - git diff --check
      - npm run lint
      - npx tsc --noEmit
      - npm run build
      - npm run test:e2e
    final_gate:
      - GitHub Actions workflow execution
  ts_ui:
    use_for:
      - React component changes
      - TypeScript UI changes
      - CSS plus TSX interaction changes
    local_run:
      - only checks explicitly named in the task
    local_do_not_run_by_default:
      - git diff --check
      - npm run lint
      - npx tsc --noEmit
      - npm run build
      - npm run test:e2e
    final_gate:
      - GitHub Actions lint/build/e2e
  runtime_route_or_config:
    use_for:
      - Next route changes
      - app runtime behavior changes
      - package/dependency changes
      - build/config changes
    local_run:
      - only checks explicitly named in the task
    local_do_not_run_by_default:
      - git diff --check
      - npm run lint
      - npx tsc --noEmit
      - npm run build
      - npm run test:e2e
    final_gate:
      - GitHub Actions lint/build/e2e
  e2e_sensitive:
    use_for:
      - Playwright config or E2E tests
      - hydration behavior
      - browser-local state
      - navigation behavior covered by smoke tests
      - provider-route guards
      - UI interactions explicitly covered by smoke tests
    local_run:
      - only checks explicitly named in the task
    local_do_not_run_by_default:
      - git diff --check
      - npm run lint
      - npx tsc --noEmit
      - npm run build
      - focused Playwright tests
      - npm run test:e2e
    final_gate:
      - GitHub Actions lint/build/e2e

read_first_by_mode:
  Mini:
    - AGENTS.md
    - explicitly named files
  Spar:
    - AGENTS.md
    - prompts/codex-quick-rules.yaml
    - relevant files only
  Normal:
    - AGENTS.md
    - prompts/codex-quick-rules.yaml
    - prompts/codex-task-template.yaml
    - prompts/codex-execution-rules.yaml
    - relevant files selected with targeted search
  Voll:
    - AGENTS.md
    - prompts/master-prompt.yaml
    - prompts/codex-quick-rules.yaml
    - prompts/codex-task-template.yaml
    - prompts/codex-execution-rules.yaml
    - prompts/workflow-chatgpt-codex.yaml
    - docs/DEVELOPMENT_WORKFLOW.md
    - docs/PROJECT_STATUS.md
    - relevant ADRs

read_policy_notes:
  - The read_first_by_mode list defines implementation context, not every review or merge gate.
  - GitHub actions, reviews and merges may require additional rule checks from docs/DEVELOPMENT_WORKFLOW.md and AGENTS.md.
  - For Mini/Spar/Normal, do not fully read large docs unless the task specifically changes or depends on them.
  - Prefer rg/git grep and focused excerpts for implementation context.
  - Keep static reusable constraints before task-specific details when writing prompts; put dynamic issue details later.

issue_linking:
  parent_issue: Refs only
  complete_sub_issue: Fixes allowed
  partial_work: Refs only
  review_fix: re-check PR body after changes

efficiency_block: |
  Efficiency constraints:
  - Use targeted rg/git grep/git ls-files before full-file reads.
  - Prefer focused excerpts around matches over full-file reads for large files.
  - Batch independent reads where practical.
  - Stop and report if two implementation strategies fail for the same blocker.
  - Keep progress updates short and milestone-based.
  - Do not print huge logs or full generated outputs.

context_budget_block: |
  Token / context budget:
  - Treat broad UI, architecture, data and test tasks as context-budgeted work.
  - Do not print full files or full diffs unless necessary for a safe edit or diagnosis.
  - Prefer git diff --stat plus targeted changed-hunk excerpts after implementation.
  - Manual browser inspection is optional unless automated tests do not cover the changed behavior, a visual interaction must be checked, or the task explicitly requires browser review.
  - If more than 6 app files seem necessary for a non-Voll task, stop and propose a smaller implementation slice unless the prompt explicitly allows the broader scope.
  - Prefer an analysis-only first pass for broad or uncertain work before implementing.

verification_profile_block: |
  Verification profile:
  - Default profile: not_run_by_default.
  - Select one profile: not_run_by_default, docs_or_prompt_only, workflow_only, ts_ui, runtime_route_or_config, or e2e_sensitive.
  - Do not run local checks unless the task explicitly names the check.
  - Do not run tests, lint, typecheck, build, Playwright, smoke, browser, API or deploy commands by default.
  - GitHub Actions, user review and ChatGPT diff review are the default final gates.

known_patterns_block: |
  Known project patterns:
  - Playwright local-state tests should use storageState and http://localhost:3000.
  - Do not use addInitScript, setup routes or post-navigation localStorage writes for initial hydration-state fixtures unless explicitly justified.
  - Run focused Playwright tests only when the task explicitly requests them.
  - Rely on GitHub Actions V1 Playwright smoke as the final PR E2E gate.
  - Do not run lint, build and E2E tests concurrently.

template: |
  Repo: AdrianR98/parqet-app
  Mode: <Mini|Spar|Normal|Voll|Folgeauftrag|Review-Fix>
  Branch: <type>/<short-description>
  Create PR: no

  Task title:
  <short title>

  Linked issues:
  Refs #<parent>
  Fixes #<child-if-fully-completed>

  Goal:
  <what should be true after this task>

  Budget / execution limits:
  - Do not commit.
  - Do not push.
  - Do not create a PR.
  - Do not run tests, lint, typecheck, build, Playwright, Vitest, Jest, smoke probes, browser probes, API probes, Vercel deploys or verification commands unless explicitly requested.
  - Read only the minimum required files.
  - Prefer targeted sections/ranges over full-file reads.
  - Do not run broad repository searches unless blocked.

  Hard output limit:
  - Do not print command logs.
  - Do not print command transcripts.
  - Do not list executed commands.
  - Do not mention routine reads/searches/checks.
  - Do not narrate implementation phases.
  - Do not print full files, full diffs, full logs or generated output.
  - If verification is run, summarize only status, not commands or logs.
  - Use verification line format only:
    - Verification: <check name> — passed
    - Verification: <check name> — failed: <short reason>
    - Verification: not run — <reason>
  - Do not include Run/npm command blocks unless explicitly requested.
  - Only output a blocker message if blocked; otherwise output only final compact handoff.

  Allowed changes:
  - <specific path or area>

  Do not modify:
  - <specific path or critical area>

  Non-goals:
  - <explicitly out of scope>

  Acceptance criteria:
  - [ ] <criterion>

  Verification profile:
  - not_run_by_default

  Verification:
  - Not run by Codex unless explicitly requested. User/ChatGPT will verify after implementation.

  API Budget Impact:
  - <none, or request impact / cache strategy / retry and rate-limit behavior>

  Privacy/Data Impact:
  - <none, or private data / diagnostics / export / redaction impact>

  Read first:
  - AGENTS.md
  - <mode-specific files from read_first_by_mode>
  - <other files required by scope>

  Efficiency constraints:
  - Use targeted rg/git grep/git ls-files before full-file reads only when exact files are unknown.
  - Prefer focused excerpts around matches over full-file reads for large files.
  - Batch independent reads where practical.
  - Stop and report if two implementation strategies fail for the same blocker.

  Token / context budget:
  - Treat this as a context-budgeted task.
  - Do not print full files or full diffs unless necessary for a safe edit or diagnosis.
  - Do not run manual browser inspection unless this task explicitly requires browser review.
  - If more than 6 app files seem necessary, stop and propose a smaller implementation slice unless this task explicitly allows the broader scope.

  Tool / Plugin Guidance:
  - GitHub/repository context is the source of truth.
  - Superpowers may be used for planning, debugging, TDD discipline when tests are explicitly in scope, review discipline and branch-finish workflow.
  - Superpowers must not override repo rules, linked issue scope, Non-goals, API Budget Impact, Privacy/Data Impact, verification profile or required Codex task fields.
  - Vercel may be used for Vercel/Next.js/deployment/build/config/log questions or deployment verification.
  - Vercel must not be used for routine docs-only or data-pipeline research tasks unless deployment/build behavior is relevant.
  - Vercel project settings, environment variables and deployment protection must not be changed unless explicitly authorized.
  - Figma may be used for UI/UX design, design-system, component, layout, FigJam diagram, flowchart, presentation/concept visualization or design-to-code tasks when explicitly relevant.
  - Figma must not be used for routine data-pipeline, provider/API, backend, privacy or docs-only tasks unless the task explicitly asks for visual/design artifacts.
  - Figma files must not be created or modified unless the task explicitly allows Figma write actions.
  - Figma-derived UI/code must still be reviewed against repository components, theme tokens, accessibility, API Budget Impact and Privacy/Data Impact before implementation.
  - Browser/Playwright tooling may be used only when UI behavior, hydration, navigation, visual behavior or smoke-test verification is in scope.
  - Additional plugins must be task-relevant and mentioned in Codex's final report or by the PR author if they materially affected findings, verification or implementation.

  Known project patterns:
  - <include only patterns relevant to this task>

  Handoff requirements:
  - Do not commit.
  - Do not push.
  - Do not create PR.
  - Use compact handoff format only:
    - Branch
    - Changed files
    - Removed files, if any
    - What changed
    - Verification
    - Known blockers / manual checks
    - Commit SHA
    - PR URL, if already open

  Deletion policy:
  - If a feature/path/provider/UI flow is replaced and explicitly removed, delete it from code and docs.
  - Do not preserve it as deprecated, legacy, fallback or historical implementation unless the task explicitly requests a transitional compatibility path.

  Risks / notes:
  - <risk or note to watch>

voll_required_note: >
  Use Voll for risky first tasks involving auth/OAuth, tokens/cookies,
  Parqet API contracts, persistence, caching, security, Branch Protection,
  or large refactorings. Data-pipeline first tasks should usually use Voll;
  small follow-ups may use Normal only when the canonical pipeline is not
  being restructured.

stop_conditions:
  - missing required field from required_fields
  - missing branch name when work requires branch or PR
  - missing mode
  - product goal uncertainty
  - user-flow uncertainty
  - data-model uncertainty
  - private data or secret suspicion
  - scope would exceed mode file limits except Voll
  - requested change conflicts with current workflow rules
  - two failed implementation strategies for the same blocker without a new diagnosis
  - more than 6 app files are needed for a non-Voll implementation task without explicit broader-scope permission
