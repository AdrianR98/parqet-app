name: Bug
description: Report a defect, regression or unexpected behavior.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, cookies, OAuth codes, private Parqet exports, real portfolio data or screenshots with private data.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be fixed?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What happens today? Include reproduction steps when useful.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Bug is reproduced or clearly explained.
        - [ ] Expected behavior is restored.
        - [ ] Regression risk is reviewed.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      placeholder: |
        - No unrelated refactor.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification / review plan
      placeholder: |
        - Run npm run lint.
        - Run npm run build.
        - Add manual reproduction notes when app behavior is affected.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: What could regress or remain uncertain?
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links / related issues
      description: Related issues, PRs, docs or ADRs.
    validations:
      required: false
