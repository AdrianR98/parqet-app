name: Decision
description: Capture an architecture, workflow or governance decision.
title: "decision: "
body:
  - type: markdown
    attributes:
      value: |
        Use an ADR when the decision affects future architecture, workflow or governance.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What decision is needed?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What constraints, options or prior decisions matter?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Decision is recorded.
        - [ ] ADR is added or explicitly not needed.
        - [ ] Consequences are documented.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      placeholder: |
        - No implementation unless a follow-up issue says so.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification / review plan
      placeholder: |
        - Review ADR or decision notes.
        - Confirm affected docs are linked.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: What could this decision block or complicate?
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links / related issues
    validations:
      required: false
