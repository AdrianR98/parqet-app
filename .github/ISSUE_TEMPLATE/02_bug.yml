name: Bug
description: Report a defect, regression or unexpected behavior.
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, cookies, OAuth codes, private exports, real portfolio data or screenshots with private data.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Release blocker
        - High
        - Medium
        - Low
        - Needs triage
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - App shell / navigation
        - Dashboard
        - Assets
        - Activities
        - Timeline
        - Reports / exports
        - Settings / diagnostics
        - Auth / provider connection
        - Data pipeline / API
        - Documentation / governance
        - Unknown
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots or examples must be redacted and privacy-safe.
    validations:
      required: true
  - type: textarea
    id: api_budget
    attributes:
      label: API Budget Impact
      description: Required. Enter "none" only when consciously not applicable.
      placeholder: |
        - Provider/API requests involved:
        - Hidden reload or retry suspicion:
        - Rate-limit or stale-data impact:
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy / Data Impact
      description: Required. Enter "none" only when consciously not applicable.
      placeholder: |
        - Private data involved:
        - Logs/diagnostics/exports:
        - Redaction notes:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Fix acceptance criteria
      placeholder: |
        - [ ] Bug is reproduced or clearly explained.
        - [ ] Expected behavior is restored.
        - [ ] Regression risk is reviewed.
    validations:
      required: true
