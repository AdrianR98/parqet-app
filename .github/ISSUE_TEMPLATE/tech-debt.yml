name: Tech Debt
description: Propose a bounded technical improvement without new product behavior.
title: "chore: "
body:
  - type: markdown
    attributes:
      value: |
        Keep refactors small and reviewable. Architecture changes need an ADR.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What technical problem should be reduced?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is the current state and why is it a problem?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Scope is bounded.
        - [ ] Behavior is preserved unless explicitly documented.
        - [ ] Verification plan is completed.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      placeholder: |
        - No unrelated cleanup.
        - No product behavior changes.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification / review plan
      placeholder: |
        - Run npm run lint.
        - Run npm run build.
        - Add targeted tests only if test infrastructure exists and the issue asks for them.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Regression, migration or review risks.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links / related issues
    validations:
      required: false
