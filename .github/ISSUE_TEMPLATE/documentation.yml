name: Documentation
description: Request README, docs, prompt or ADR documentation work.
title: "docs: "
body:
  - type: markdown
    attributes:
      value: |
        English is the source of truth. Documentation issues do not require app tests unless app behavior is changed.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What documentation should be created or changed?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this documentation needed? Which source files or docs should be read?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] English source document is updated.
        - [ ] No product behavior is changed.
        - [ ] German translation impact is stated when matching .de.md files exist.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      placeholder: |
        - No app implementation changes.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification / review plan
      placeholder: |
        - Review links and consistency.
        - App tests are not required for documentation-only changes.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: What could be misleading, incomplete or stale?
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links / related issues
    validations:
      required: false
