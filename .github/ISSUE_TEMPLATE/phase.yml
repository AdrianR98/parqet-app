name: Phase
description: Track a repository phase or parent planning item.
title: "phase: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this phase establish?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this phase exist and what depends on it?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Child issues are identified.
        - [ ] Deliverables are clear.
        - [ ] Exit criteria are documented.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      placeholder: |
        - No work outside this phase boundary.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification / review plan
      placeholder: |
        - Review linked PRs and docs.
        - Confirm child issues are closed or deferred.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Planning, dependency or sequencing risks.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links / related issues
    validations:
      required: false
