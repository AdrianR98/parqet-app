name: Agent Task
description: Define a bounded task for Codex or a future agent.
title: "agent: "
body:
  - type: markdown
    attributes:
      value: |
        Default Codex mode is Spar. Use Voll for risky first tasks involving auth, tokens, API contracts, data pipeline, persistence, caching, CI, security or large refactorings.
  - type: input
    id: mode
    attributes:
      label: Mode
      placeholder: Mini / Spar / Normal / Voll / Folgeauftrag / Review-Fix
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the agent accomplish?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Read-first files, constraints and relevant links.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Scope is completed.
        - [ ] Non-goals are respected.
        - [ ] Verification is reported.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      placeholder: |
        - No unrelated changes.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification / review plan
      placeholder: |
        - Run npm run lint.
        - Run npm run build.
        - Run repo verification commands.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Scope, security, privacy, product or CI risks.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links / related issues
    validations:
      required: false
