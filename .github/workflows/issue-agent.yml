name: Issue Agent

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to inspect"
        required: true
        type: string
      mode:
        description: "Run mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

permissions:
  issues: write
  contents: read

jobs:
  issue-agent:
    name: Manual Issue-Agent v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Issue-Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_AGENT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_AGENT_MODE: ${{ inputs.mode }}
        run: node .github/scripts/issue-agent.mjs
